min_version = "2026.11.10"

[tools]
rust = { version = "1.100.0", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
], mr_boxington = true }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
mr-boxington = { version = "1.30.0", workflow = "release.yml@refs/heads/main" }
hk = "2.12.0"
"aqua:release-plz/release-plz" = "0.4.3"

[settings]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }
