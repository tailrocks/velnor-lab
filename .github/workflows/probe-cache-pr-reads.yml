name: probe cache pr reads
on:
  workflow_dispatch:
    inputs:
      tag:
        description: unique tag of this probe run
        required: false
      role:
        description: default, base or head, the entry to save on the ref the run is dispatched on
        required: false
  pull_request:
    paths: ['probes/cache-pr-reads/**']
permissions:
  contents: read
env:
  PREFIX: lab-probe-reads
jobs:
  reads:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/probe
        with:
          mode: context
      - if: github.event_name == 'workflow_dispatch'
        run: mkdir probe-data && echo "$PROBE_TAG" > probe-data/file
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe-data
          key: ${{ env.PREFIX }}-${{ env.PROBE_TAG }}-${{ env.PROBE_ROLE }}
      - id: default_branch
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe-data
          key: ${{ env.PREFIX }}-${{ env.PROBE_TAG }}-default
      - id: base_branch
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe-data
          key: ${{ env.PREFIX }}-${{ env.PROBE_TAG }}-base
      - id: head_branch
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: probe-data
          key: ${{ env.PREFIX }}-${{ env.PROBE_TAG }}-head
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/probe
        with:
          mode: record
          probe: cache-pr-reads
          leg: pull_request
          data: >-
            {"default_branch": {"hit": "${{ steps.default_branch.outputs.cache-hit }}", "matched": "${{ steps.default_branch.outputs.cache-matched-key }}"},
            "base_branch": {"hit": "${{ steps.base_branch.outputs.cache-hit }}", "matched": "${{ steps.base_branch.outputs.cache-matched-key }}"},
            "head_branch": {"hit": "${{ steps.head_branch.outputs.cache-hit }}", "matched": "${{ steps.head_branch.outputs.cache-matched-key }}"}}
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observation
          path: observation/
