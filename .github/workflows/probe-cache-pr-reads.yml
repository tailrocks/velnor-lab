name: PR delta verification 609
on:
  workflow_dispatch:
    inputs:
      tag:
        description: completed Rust CI run ID, or exact PR delta key
        required: true
        type: string
      role:
        description: trim or probe
        required: true
        type: string
permissions:
  contents: read
jobs:
  rust-trim:
    if: '${{ inputs.role == ''trim'' }}'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the trusted 609 helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-ci-609-snapshot
          path: ${{ runner.temp }}/vbin
          run-id: 43987327544
          github-token: ${{ github.token }}
      - name: Install the trusted 609 helper
        run: sudo install -m 0755 "$RUNNER_TEMP/vbin/velnor-ci" /usr/local/bin/velnor-ci
      - name: Keep one PR delta per lane
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          RUN_ID: '${{ inputs.tag }}'
        run: velnor-ci cache trim-deltas --run-id "$RUN_ID"
  restore-isolation:
    if: '${{ inputs.role == ''probe'' }}'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: probe
        name: Attempt to read the PR delta
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target.velnor-delta
          key: '${{ inputs.tag }}'
      - name: Require the PR delta to be inaccessible
        env:
          MATCHED_KEY: '${{ steps.probe.outputs.cache-matched-key }}'
        run: test -z "$MATCHED_KEY"
