name: probe cache mode
on:
  pull_request:
    paths: ['probes/cache-mode/**']
permissions:
  contents: read
env:
  PREFIX: lab-cm-${{ github.run_id }}
jobs:
  writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: write
    permissions:
      actions: write
      contents: read
    steps:
      - run: mkdir -p d && echo writer > d/file
      - id: save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: d
          key: ${{ env.PREFIX }}-writer
      - name: Entries now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$PREFIX&per_page=20" --jq '.actions_caches[]|"\(.key) \(.ref)"' | tee -a "$GITHUB_STEP_SUMMARY"
  reader:
    needs: writer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: read
    permissions:
      actions: write
      contents: read
    steps:
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: d
          key: ${{ env.PREFIX }}-writer
      - run: |
          echo "restore hit=${{ steps.restore.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: mkdir -p e && echo reader > e/file
      - id: save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e
          key: ${{ env.PREFIX }}-reader
      - name: Did the read-mode save land, and does REST delete still work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- entries after the read-mode save (reader key must be absent)" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$PREFIX&per_page=20" --jq '.actions_caches[]|"\(.key) \(.ref)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- REST delete of the writer entry from a read-mode job" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches?key=$PREFIX-writer&ref=refs/pull/${{ github.event.pull_request.number }}/merge" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$PREFIX&per_page=20" --jq '.actions_caches[]|"\(.key) \(.ref)"' | tee -a "$GITHUB_STEP_SUMMARY"
