name: probe setup
on:
  push:
    branches: [probe/585-setup]
permissions:
  contents: read
env:
  CARGO_LOG: cargo::core::compiler::fingerprint=info
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - run: cat /proc/self/cgroup
      - run: ls /sys/fs/cgroup
      - run: df -B1 --output=used,avail /
      - run: nproc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: rust mr-boxington aqua:nextest-rs/nextest/cargo-nextest
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
      - run: cargo fmt --all --check
      - run: mbx clippy --workspace --all-targets --locked -- -D warnings
      - run: mbx nextest run --workspace --locked
      - run: mbx nextest archive --workspace --locked --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
      - run: ls -la "$RUNNER_TEMP"
      - run: mbx stats --json > "$RUNNER_TEMP/mbx-stats.json"
      - run: mbx analyze > "$RUNNER_TEMP/mbx-analyze.txt"
      - run: cat "$RUNNER_TEMP/mbx-stats.json"
      - run: cat "$RUNNER_TEMP/mbx-analyze.txt"
      - run: find /sys/fs/cgroup -maxdepth 3 -name memory.peak
      - run: df -B1 --output=used,avail /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1
  test:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: aqua:nextest-rs/nextest/cargo-nextest
      - run: cargo-nextest nextest run --archive-file "${{ runner.temp }}/nextest-archive.tar.zst" --workspace-remap . --partition hash:${{ matrix.partition }}/2
