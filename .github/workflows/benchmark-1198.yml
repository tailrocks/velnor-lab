name: Generator benchmark for PR 1198

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: stable
          cache: false

      - name: Build and benchmark both revisions
        shell: bash
        run: |
          set -euo pipefail

          echo 'Runner image:'
          cat /etc/os-release
          echo 'CPU:'
          lscpu
          echo 'Load at start:'
          uptime
          echo "Logical CPUs: $(nproc)"

          sudo apt-get update
          sudo apt-get install --yes hyperfine
          hyperfine --version

          repo="$RUNNER_TEMP/velnor-new"
          before="$RUNNER_TEMP/velnor-before"
          after="$RUNNER_TEMP/velnor-after"
          before_target="$RUNNER_TEMP/cargo-target-before"
          after_target="$RUNNER_TEMP/cargo-target-after"
          git clone https://github.com/tailrocks/velnor-new.git "$repo"
          git -C "$repo" fetch origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/pull/1198/head:refs/remotes/origin/pr-1198
          base="$(git -C "$repo" merge-base origin/main origin/pr-1198)"
          head="$(git -C "$repo" rev-parse origin/pr-1198)"
          printf 'PR merge base: %s\nPR head: %s\n' "$base" "$head"
          git -C "$repo" worktree add "$before" "$base"
          git -C "$repo" worktree add "$after" "$head"

          (cd "$before/generator" && CARGO_TARGET_DIR="$before_target" cargo build --locked --release -p velnor-gen)
          cp "$before_target/release/velnor-gen" "$RUNNER_TEMP/velnor-gen-before"
          (cd "$after/generator" && CARGO_TARGET_DIR="$after_target" cargo build --locked --release -p velnor-gen)
          cp "$after_target/release/velnor-gen" "$RUNNER_TEMP/velnor-gen-after"

          cp "$before/generator/samples/release-bin/view/.velnor/rust-ci.lock" "$before/.velnor/rust-ci.lock"
          cp "$after/generator/samples/release-bin/view/.velnor/rust-ci.lock" "$after/.velnor/rust-ci.lock"
          git -C "$before" add -- .velnor/rust-ci.lock
          git -C "$after" add -- .velnor/rust-ci.lock

          prepare_sample() {
            source="$1"
            sample="$2"
            mkdir -p "$sample"
            cp -R "$source/fixtures/parity/multi-crate/input/." "$sample/"
            for file in rust-toolchain.toml mise.toml mise.lock; do
              cp "$source/$file" "$sample/$file"
            done
            mkdir -p "$sample/.velnor"
            cp "$source/generator/samples/release-bin/view/.velnor/rust-ci.lock" "$sample/.velnor/rust-ci.lock"
            git -C "$sample" init --quiet -b main
            git -C "$sample" remote add origin https://github.com/tailrocks/velnor-lab.git
            git -C "$sample" add --all
          }
          prepare_sample "$before" "$RUNNER_TEMP/sample-before"
          prepare_sample "$after" "$RUNNER_TEMP/sample-after"

          printf 'Before rustc: '
          (cd "$before/generator" && rustc --version)
          printf 'After rustc: '
          (cd "$after/generator" && rustc --version)

          labels=(before-workspace after-workspace before-largest-sample after-largest-sample)
          commands=(
            "$RUNNER_TEMP/velnor-gen-before --root $before generate"
            "$RUNNER_TEMP/velnor-gen-after --root $after generate"
            "$RUNNER_TEMP/velnor-gen-before --root $RUNNER_TEMP/sample-before generate"
            "$RUNNER_TEMP/velnor-gen-after --root $RUNNER_TEMP/sample-after generate"
          )
          warmups="$RUNNER_TEMP/hyperfine-warmups"
          samples="$RUNNER_TEMP/hyperfine-samples"
          mkdir -p "$warmups" "$samples"

          run_once() {
            local index="$1"
            local output="$2"
            hyperfine --runs 1 --command-name "${labels[$index]}" \
              --export-json "$output" "${commands[$index]}" >/dev/null
          }

          echo 'Five alternating warmups per command:'
          for warmup in $(seq 1 5); do
            if (( warmup % 2 == 1 )); then
              order=(0 1 2 3)
            else
              order=(1 0 3 2)
            fi
            for index in "${order[@]}"; do
              run_once "$index" "$warmups/warmup-$warmup-${labels[$index]}.json"
            done
          done

          echo 'Thirty interleaved runs per command:'
          for run in $(seq 1 30); do
            printf -v run_id '%02d' "$run"
            if (( run % 2 == 1 )); then
              order=(0 1 2 3)
            else
              order=(1 0 3 2)
            fi
            for index in "${order[@]}"; do
              run_once "$index" "$samples/run-$run_id-${labels[$index]}.json"
            done
          done

          hyperfine_version="$(hyperfine --version | awk '{print $2}')"
          jq -s --arg version "$hyperfine_version" '
            [.[].results[0]] as $samples
            | ["before-workspace", "after-workspace", "before-largest-sample", "after-largest-sample"] as $labels
            | {
                version: $version,
                results: [
                  $labels[] as $label
                  | [$samples[] | select(.command == $label)] as $entries
                  | [$entries[].times[0]] as $times
                  | ($times | sort) as $sorted
                  | ($times | add / length) as $mean
                  | if ($times | length) != 30 then error("expected 30 runs for " + $label)
                    else {
                      command: $label,
                      runs: ($times | length),
                      mean: $mean,
                      stddev: (([$times[] | (. - $mean) * (. - $mean)] | add / (($times | length) - 1)) | sqrt),
                      median: (($sorted[14] + $sorted[15]) / 2),
                      p95_seconds: $sorted[28],
                      user: ([$entries[].user] | add / length),
                      system: ([$entries[].system] | add / length),
                      min: $sorted[0],
                      max: $sorted[-1],
                      spread_seconds: ($sorted[-1] - $sorted[0]),
                      times: $times
                    }
                    end
                ]
              }
          ' "$samples"/*.json > "$RUNNER_TEMP/benchmark.json"

          echo 'Interleaved hyperfine JSON summary (p95 is nearest-rank, 29th of 30 samples):'
          cat "$RUNNER_TEMP/benchmark.json"
          echo 'Load at end:'
          uptime
