name: Generator benchmark for PR 1198

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: stable
          cache: false

      - name: Build and benchmark both revisions
        shell: bash
        run: |
          set -euo pipefail

          echo 'Runner image:'
          cat /etc/os-release
          echo 'CPU:'
          lscpu
          echo 'Load at start:'
          uptime
          echo "Logical CPUs: $(nproc)"

          sudo apt-get update
          sudo apt-get install --yes hyperfine
          hyperfine --version

          repo="$RUNNER_TEMP/velnor-new"
          before="$RUNNER_TEMP/velnor-before"
          after="$RUNNER_TEMP/velnor-after"
          before_target="$RUNNER_TEMP/cargo-target-before"
          after_target="$RUNNER_TEMP/cargo-target-after"
          git clone https://github.com/tailrocks/velnor-new.git "$repo"
          git -C "$repo" fetch origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/pull/1198/head:refs/remotes/origin/pr-1198
          base="$(git -C "$repo" merge-base origin/main origin/pr-1198)"
          head="$(git -C "$repo" rev-parse origin/pr-1198)"
          printf 'PR merge base: %s\nPR head: %s\n' "$base" "$head"
          git -C "$repo" worktree add "$before" "$base"
          git -C "$repo" worktree add "$after" "$head"

          (cd "$before/generator" && CARGO_TARGET_DIR="$before_target" cargo build --locked --release -p velnor-gen)
          cp "$before_target/release/velnor-gen" "$RUNNER_TEMP/velnor-gen-before"
          (cd "$after/generator" && CARGO_TARGET_DIR="$after_target" cargo build --locked --release -p velnor-gen)
          cp "$after_target/release/velnor-gen" "$RUNNER_TEMP/velnor-gen-after"

          cp "$before/generator/samples/release-bin/view/.velnor/rust-ci.lock" "$before/.velnor/rust-ci.lock"
          cp "$after/generator/samples/release-bin/view/.velnor/rust-ci.lock" "$after/.velnor/rust-ci.lock"
          git -C "$before" add -- .velnor/rust-ci.lock
          git -C "$after" add -- .velnor/rust-ci.lock

          prepare_sample() {
            source="$1"
            sample="$2"
            mkdir -p "$sample"
            cp -R "$source/fixtures/parity/multi-crate/input/." "$sample/"
            for file in rust-toolchain.toml mise.toml mise.lock; do
              cp "$source/$file" "$sample/$file"
            done
            mkdir -p "$sample/.velnor"
            cp "$source/generator/samples/release-bin/view/.velnor/rust-ci.lock" "$sample/.velnor/rust-ci.lock"
            git -C "$sample" init --quiet -b main
            git -C "$sample" remote add origin https://github.com/tailrocks/velnor-lab.git
            git -C "$sample" add --all
          }
          prepare_sample "$before" "$RUNNER_TEMP/sample-before"
          prepare_sample "$after" "$RUNNER_TEMP/sample-after"

          printf 'Before rustc: '
          (cd "$before/generator" && rustc --version)
          printf 'After rustc: '
          (cd "$after/generator" && rustc --version)

          hyperfine --show-output --warmup 5 --runs 30 \
            --command-name before-workspace "$RUNNER_TEMP/velnor-gen-before --root $before generate" \
            --command-name after-workspace "$RUNNER_TEMP/velnor-gen-after --root $after generate" \
            --command-name before-largest-sample "$RUNNER_TEMP/velnor-gen-before --root $RUNNER_TEMP/sample-before generate" \
            --command-name after-largest-sample "$RUNNER_TEMP/velnor-gen-after --root $RUNNER_TEMP/sample-after generate" \
            --export-json "$RUNNER_TEMP/benchmark.json"

          echo 'Raw hyperfine JSON:'
          cat "$RUNNER_TEMP/benchmark.json"
          echo 'Summary (p95 is nearest-rank, 29th of 30 samples):'
          jq '[.results[] | {command, runs:(.times | length), median_seconds:.median, p95_seconds:(.times | sort | .[28]), min_seconds:.min, max_seconds:.max, spread_seconds:(.max - .min)}]' "$RUNNER_TEMP/benchmark.json"
          echo 'Load at end:'
          uptime
