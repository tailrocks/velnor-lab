      VELNOR_RELEASE_COMMIT: 4ed121e19c828ceb5cc109656a628fde3772a411
      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    permissions:
      contents: read
      actions: read
    needs:
      - plan
      - rust-app
      - rust-core
      - rust-lab
      - rust-lib
      - rust-macros
      - rust-tool
      - jactionlint
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ github.event_name == 'push' && '1' || '2' }}
          persist-credentials: "false"
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: 7129dbab31d698f9028db9374f7ba7987232b0426f837dcbce437130a61415f9
          version: 2026.11.1
      - name: Acquire Velnor
        timeout-minutes: 6
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.79\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
