name: tools determinism 2178
on:
  push:
    branches: [lab/2178-tools-determinism]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b, c, d, e, f, g, h]
        mode: [cleared]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clear the tool homes
        if: matrix.mode == 'cleared'
        run: rm -rf -- "$HOME/.local/share/mise" "$HOME/.rustup"
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
          install_args: rust mr-boxington aqua:nextest-rs/nextest/cargo-nextest
      - run: rustup component add clippy rustfmt
      - run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      - name: Components
        run: for f in ~/.rustup/toolchains/*/lib/rustlib/components; do echo "== $f"; cat "$f"; done
      - name: Manifest
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/manifest-${{ matrix.mode }}-${{ matrix.lane }}.txt"
          import hashlib, os, stat
          home = os.path.expanduser("~")
          def emit(path):
              rel = os.path.relpath(path, home)
              st = os.lstat(path)
              mode = stat.S_IMODE(st.st_mode)
              if stat.S_ISLNK(st.st_mode):
                  print(f"l\t{rel}\t{os.readlink(path)}")
              elif stat.S_ISREG(st.st_mode):
                  data = open(path, "rb").read()
                  parts = rel.split("/")
                  if len(parts) == 6 and parts[0] == ".rustup" and parts[1] == "toolchains" and parts[3:] == ["lib", "rustlib", "components"]:
                      data = b"".join(sorted(data.splitlines(keepends=True)))
                  h = hashlib.sha256(data).hexdigest()
                  print(f"f\t{rel}\t{mode:o}\t{h}")
              elif stat.S_ISDIR(st.st_mode):
                  print(f"d\t{rel}\t{mode:o}")
                  for name in sorted(os.listdir(path), key=lambda n: n.encode()):
                      emit(os.path.join(path, name))
              else:
                  print(f"?\t{rel}")
          for root in (".local/share/mise", ".rustup"):
              p = os.path.join(home, root)
              if os.path.lexists(p):
                  emit(p)
          PY
          wc -l "$RUNNER_TEMP/manifest-${{ matrix.mode }}-${{ matrix.lane }}.txt"
          sha256sum "$RUNNER_TEMP/manifest-${{ matrix.mode }}-${{ matrix.lane }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ matrix.mode }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/manifest-${{ matrix.mode }}-${{ matrix.lane }}.txt
  compare:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: m
      - run: |
          ls -l m/*
          for mode in cleared; do
            sha256sum m/manifest-$mode-*/*.txt
            for x in b c d e f g h; do
              if diff m/manifest-$mode-a/manifest-$mode-a.txt m/manifest-$mode-$x/manifest-$mode-$x.txt > d.txt; then echo "a vs $x IDENTICAL"; else echo "a vs $x DIFFERENT"; cat d.txt; fi
            done
          done
