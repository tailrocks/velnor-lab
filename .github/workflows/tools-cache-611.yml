name: Tools cache 611
on:
  push:
    branches: [lab/611-tools-cache]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install velnor-ci 0.1.81
        uses: tailrocks/velnor-new/actions/setup-velnor@a87c35aed5b68dd3e82b36df3e8d7364311abba8  # rust-ci-v0.1.81
        with:
          version: '0.1.81'
          sha256-linux-x64: '3d348312a7fe47668b5ee54a33683f1cc257479b44198a39d286fd3543836113'
          sha256-linux-arm64: '70db242c5aaa73d276d281f7943d93a07cd27020bc8386b446b13663202b5245'
          sha256-macos-arm64: 'e5defe5d41d4f83802792ba724f660c85ad7c705d174381997f30026fe27e93f'
      - id: tools
        name: Restore the tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}'
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
      - name: Add Rust components
        run: rustup component add clippy rustfmt
      - name: Add Rust targets
        run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      - name: Save the tools cache
        if: '${{ github.ref == ''refs/heads/lab/611-tools-cache'' && steps.tools.outputs.cache-hit != ''true'' }}'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}'
      - id: prepare
        name: velnor-ci prepare
        run: velnor-ci prepare
      - name: Show
        run: |
          echo "lockhash=${{ hashFiles('mise.lock') }} cache-hit=${{ steps.tools.outputs.cache-hit }}"
          du -sh ~/.local/share/mise/* ~/.rustup/* ~/.cargo 2>/dev/null || true
          ls ~/.local/share/mise ~/.local/share/mise/installs ~/.rustup/toolchains 2>&1 | head -30
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: tools
        name: Restore the tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}'
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
          install_args: 'aqua:nextest-rs/nextest/cargo-nextest'
      - name: Show
        run: |
          echo "cache-hit=${{ steps.tools.outputs.cache-hit }}"
          cargo-nextest --version
