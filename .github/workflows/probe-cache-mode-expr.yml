name: probe cache mode expression
on:
  pull_request:
    paths: ['probes/cache-mode/**']
permissions:
  contents: read
jobs:
  expr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: ${{ (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && 'write' || 'read' }}
    steps:
      - run: echo "expression accepted; mode=$ACTIONS_CACHE_MODE"
