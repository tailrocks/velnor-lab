name: Rust cache cleanup
on:
  workflow_run:
    workflows:
      - Rust CI
    types:
      - completed
permissions: {}
concurrency:
  group: 'velnor-pr-delta-cleanup-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}'
  cancel-in-progress: false
jobs:
  rust-trim:
    if: '${{ github.event.workflow_run.event == ''pull_request'' && github.event.workflow_run.head_repository.id == github.event.repository.id }}'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the trusted 609 helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-ci-609
          path: ${{ runner.temp }}/vbin
          run-id: 43961288628
          github-token: ${{ github.token }}
      - name: Install the trusted 609 helper
        run: sudo install -m 0755 "$RUNNER_TEMP/vbin/velnor-ci" /usr/local/bin/velnor-ci
      - name: Delete older PR delta entries
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          RUN_ID: '${{ github.event.workflow_run.id }}'
        run: 'velnor-ci cache trim-deltas --run-id "$RUN_ID"'
