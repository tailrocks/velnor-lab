name: probe release app
on:
  workflow_dispatch:
  push:
    branches: ['probe-721-release']
permissions: {}
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: velnor-lab
          permission-contents: write
      - name: Create probe-v0.0.1 with the App token
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/probe-v0.0.1 -f sha="$GITHUB_SHA"
  github-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create probe-v0.0.2 with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/probe-v0.0.2 -f sha="$GITHUB_SHA" 2>err.txt; then
            echo "probe-v0.0.2 was created by GITHUB_TOKEN"
            exit 1
          fi
          cat err.txt
          grep -q 'Repository rule violations found' err.txt
