# Generated by velnor-gen. Change .velnor/rust-ci.toml and run `velnor-gen generate`.
name: Rust CI
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
  merge_group: {}
  schedule:
    - cron: '26 14 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: 'ci-${{ github.workflow_ref }}-${{ github.event_name == ''pull_request'' && github.event.pull_request.number || github.run_id }}'
  cancel-in-progress: '${{ github.event_name == ''pull_request'' }}'
jobs:
  # one job: .velnor/rust-ci-timings.json has no build times for this workspace
  rust:
    permissions:
      contents: read
    outputs:
      rust_root_tests: '${{ steps.plan.outputs.rust_root_tests }}'
      # jactionlint ignore=unused-job-output
      tests_run: '${{ steps.test.outputs.tests_run }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Build velnor-ci from the velnor-new source (lab only)
        run: |
          git clone --quiet https://github.com/tailrocks/velnor-new "$RUNNER_TEMP/vsrc"
          git -C "$RUNNER_TEMP/vsrc" checkout --quiet 66a9dc0e91475eb53e00e4160b9e174ab1df8572
          cd "$RUNNER_TEMP/vsrc/ci-helper"
          cargo build --quiet -p velnor-ci
          echo "$RUNNER_TEMP/vsrc/ci-helper/target/debug" >> "$GITHUB_PATH"
      - id: plan
        name: velnor-ci plan
        run: |
          velnor-ci plan --explain
          echo "--- step summary ---"
          cat "$GITHUB_STEP_SUMMARY"
      - name: Install tools
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: '2026.11.1'
          cache: false
      - name: Add Rust components
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: rustup component add clippy rustfmt
      - name: Add Rust targets
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
      - id: prepare
        name: velnor-ci prepare
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci prepare
      - name: velnor-ci check-metadata
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci check-metadata
      - name: Restore the sources cache
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-root-${{ hashFiles(''Cargo.lock'') }}'
          restore-keys: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-root-'
      - name: Restore the target cache
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: 'velnor-tgt-rust-root-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles(''Cargo.lock'') }}-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: |
            velnor-tgt-rust-root-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ hashFiles('Cargo.lock') }}-
            velnor-tgt-rust-root-${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-
      - id: restored
        name: velnor-ci restored
        if: '${{ steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci restored
      - name: Format
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci run -- cargo-fmt --all --check
      - name: Lint
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        env:
          PACKAGE_ARGS: '${{ steps.plan.outputs.rust_root_package_args }}'
        run: 'velnor-ci run -- cargo-clippy clippy $PACKAGE_ARGS --all-targets --locked -- -D warnings'
      - id: test
        name: Test
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        env:
          TEST_FILTER: '${{ steps.plan.outputs.rust_root_test_filter }}'
          PACKAGE_ARGS: '${{ steps.plan.outputs.rust_root_package_args }}'
        run: 'velnor-ci run -- cargo-nextest nextest run $PACKAGE_ARGS --locked --no-fail-fast --ignore-default-filter -E "$TEST_FILTER" --no-tests=pass'
      - name: Doctests
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' && steps.plan.outputs.rust_root_doctests == ''run'' && steps.plan.outputs.rust_root_package_args != '''' }}'
        env:
          PACKAGE_ARGS: '${{ steps.plan.outputs.rust_root_package_args }}'
          DOCTESTS_KNOWN: '${{ steps.plan.outputs.rust_root_doctests_known }}'
        run: 'velnor-ci run --require-doctests=$DOCTESTS_KNOWN -- cargo test --doc $PACKAGE_ARGS --locked'
      - name: velnor-ci inputs audit
        if: '${{ (github.event_name == ''schedule'' || github.event_name == ''push'') && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' }}'
        run: velnor-ci inputs audit
      - name: Documentation
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_root_mode != ''none'' && steps.plan.outputs.rust_root_docs == ''run'' && steps.plan.outputs.rust_root_package_args != '''' }}'
        env:
          PACKAGE_ARGS: '${{ steps.plan.outputs.rust_root_package_args }}'
        run: 'velnor-ci run -- cargo doc $PACKAGE_ARGS --no-deps --locked --config ''build.rustdocflags=["-D","warnings"]'''
      - name: Check alpha alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && (contains(format('' {0} '', steps.plan.outputs.rust_root_package_args), '' -p alpha '') || contains(format('' {0} '', steps.plan.outputs.rust_root_package_args), '' --workspace '')) }}'
        run: velnor-ci run -- cargo check -p alpha --locked
      - name: Check beta alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && (contains(format('' {0} '', steps.plan.outputs.rust_root_package_args), '' -p beta '') || contains(format('' {0} '', steps.plan.outputs.rust_root_package_args), '' --workspace '')) }}'
        run: velnor-ci run -- cargo check -p beta --locked
      - name: Check gamma alone
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.plan.outcome == ''success'' && (contains(format('' {0} '', steps.plan.outputs.rust_root_package_args), '' -p gamma '') || contains(format('' {0} '', steps.plan.outputs.rust_root_package_args), '' --workspace '')) }}'
        run: velnor-ci run -- cargo check -p gamma --locked
  required:
    name: Required
    needs:
      - rust
    if: '${{ always() }}'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build velnor-ci from the velnor-new source (lab only)
        run: |
          git clone --quiet https://github.com/tailrocks/velnor-new "$RUNNER_TEMP/vsrc"
          git -C "$RUNNER_TEMP/vsrc" checkout --quiet 66a9dc0e91475eb53e00e4160b9e174ab1df8572
          cd "$RUNNER_TEMP/vsrc/ci-helper"
          cargo build --quiet -p velnor-ci
          echo "$RUNNER_TEMP/vsrc/ci-helper/target/debug" >> "$GITHUB_PATH"
      - name: velnor-ci gate
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
        run: 'velnor-ci gate --plan rust --job rust=always --tests rust=root'
