      - cache
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (always()) }}'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the development helper
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-ci
          path: '${{ runner.temp }}/vbin'
      - name: Install the development helper
        run: sudo install -m 755 "$RUNNER_TEMP/vbin/velnor-ci" /usr/local/bin/velnor-ci
      - name: velnor-ci gate
        env:
          NEEDS_JSON: '${{ toJSON(needs) }}'
          GATE_SPEC: '--plan rust-plan --job rust-plan=always --job rust-root=lane:root --job rust-lab=lane:lab --job rust-inputs-audit=schedule-or-dispatch --job cache=always --tests rust-root=root --tests rust-lab=lab'
        run: velnor-ci gate --spec-env GATE_SPEC
