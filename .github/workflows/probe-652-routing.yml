name: probe 652 routing
on:
  push:
    branches: [probe/652-setup]
permissions:
  contents: read
env:
  CARGO_LOG: cargo::compiler::fingerprint=info
  MBX_BLAZE: "1"
  BLAZE_VERSION: v0.20261105.4
  BLAZE_HOME: /blaze/home
  ARCHIVE: blaze-v0.20261105.4-x86_64-unknown-linux-gnu
jobs:
  ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: rust mr-boxington aqua:nextest-rs/nextest/cargo-nextest
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
      - run: curl -fsSLo "$RUNNER_TEMP/$ARCHIVE.tar.gz" "https://github.com/indexable-inc/blaze/releases/download/$BLAZE_VERSION/$ARCHIVE.tar.gz"
      - run: sha256sum -c --ignore-missing "$GITHUB_WORKSPACE/.github/blaze.sha256"
        working-directory: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/$ARCHIVE.tar.gz" -C "$RUNNER_TEMP"
      - run: echo "$RUNNER_TEMP/$ARCHIVE" >> "$GITHUB_PATH"
      - run: sudo prlimit --pid "$PPID" --memlock=unlimited:unlimited
      - run: truncate -s 12G "$RUNNER_TEMP/blaze.img"
      - run: sudo mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/blaze.img"
      - run: sudo mkdir -p /blaze
      - run: sudo mount -o loop "$RUNNER_TEMP/blaze.img" /blaze
      - run: sudo install -d -m 700 -o runner -g runner /blaze/home
      - run: blaze toolchain
      - run: mbx setup --yes
      - run: echo "$HOME/.local/share/mbx/bin" >> "$GITHUB_PATH"
      - run: command -v cargo blaze
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        continue-on-error: true
      - run: cargo nextest run --workspace --locked
        continue-on-error: true
      - run: cargo test --doc --workspace --locked
        continue-on-error: true
      - run: cargo doc --workspace --no-deps --locked
        continue-on-error: true
      - run: blaze status --json
      - run: mbx stats --json
